/* The original screenshot is the visual master. These overlays only replace
   the old live/table data so the wallpaper, spacing, proportions and artwork
   remain pixel-for-pixel from the supplied reference. */
#liveReplace{position:absolute;left:2.4%;top:27.0%;width:94.8%;height:20.35%;border:3px solid #f52832;border-radius:18px;background:#090b0f;overflow:hidden}
.liveHead{height:23%;border-bottom:2px solid #f52832;display:flex;align-items:center;justify-content:space-between;padding:0 3%;font-weight:900}
.liveTitle{font-size:clamp(18px,5vw,34px);letter-spacing:.3px;display:flex;align-items:center;gap:10px}
.dot{width:18px;height:18px;border-radius:50%;background:#ff2732;display:inline-block}
.meta{font-size:clamp(9px,2.2vw,15px);color:#c4c6cb;font-weight:800}
.matchArea{height:45%;display:flex;align-items:center;justify-content:center;gap:3%;position:relative}
.player{width:24%;text-align:center;font-size:clamp(16px,4vw,28px);font-weight:900}
.under{height:3px;background:#ef2732;width:72%;margin:7px auto 0}
.scores{display:flex;align-items:center;gap:9px}
.box{width:clamp(45px,10vw,72px);height:clamp(45px,10vw,72px);border-radius:9px;background:#15171b;border:1px solid #555b63;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,7vw,50px);font-weight:900}
.box.hot{background:#ef2b33;border-color:#ff5359}
.dash{font-size:clamp(22px,5vw,36px);font-weight:900}
.chev{font-size:32px;color:#ddd;position:absolute;right:2%;top:50%;transform:translateY(-50%)}
.matchNote{height:12%;text-align:center;color:#bfc2c8;font-size:clamp(9px,2.3vw,15px);font-weight:800}
.next{height:32%;border-top:1px solid #33353b;padding:1.8% 2.3%}
.nextbar{display:flex;justify-content:space-between;align-items:center;font-size:clamp(10px,2.6vw,17px);margin-bottom:1.5%}
.nextbar b:first-child{color:#ff2932}
.queue{display:grid;grid-template-columns:1fr 8px 1fr 8px 1fr;gap:7px;align-items:center}
.fixture{border:1px solid #383c43;border-radius:9px;text-align:center;padding:3px 2px;min-height:62px;display:flex;flex-direction:column;justify-content:center;font-size:clamp(9px,2.4vw,15px);background:#101216}
.fixture small{color:#9da0a7;font-weight:800;font-size:.72em}
.shuffle{font-size:18px;color:#eee}

#tableReplace{position:absolute;left:2.4%;top:62.15%;width:94.8%;height:21.3%;border:2px solid #30343a;border-radius:13px;background:#0c0e12;overflow:hidden}
.tableHead{height:20%;display:flex;justify-content:space-between;align-items:center;padding:0 2.5%;border-bottom:1px solid #3a3d43;font-weight:900}
.tableHead span:first-child{font-size:clamp(13px,3.7vw,25px)}
.tableHead .green{color:#17d56b}
.updated{font-size:clamp(8px,2vw,13px);color:#aeb1b7}
table{width:100%;height:80%;border-collapse:collapse;table-layout:fixed;font-size:clamp(8px,2.2vw,14px)}
th{color:#aeb1b7;font-weight:800;font-size:.85em;padding:2px 1px}
td{text-align:center;border-top:1px solid #20242a;padding:2px 1px;font-weight:700}
td:nth-child(2),th:nth-child(2){text-align:left}
.rank{display:inline-flex;width:clamp(22px,6vw,38px);height:clamp(22px,6vw,38px);border-radius:6px;background:#ef2932;align-items:center;justify-content:center;color:white;font-weight:900}
.pts{color:#ff3038;font-weight:900}
.plus{color:#1dde70;font-weight:900}
.minus{color:#ff3942;font-weight:900}

/* Transparent hit areas preserve the exact reference artwork underneath. */
.hit{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;z-index:20}
#hLeague{left:2.2%;top:48.2%;width:47.1%;height:6.15%}
#hToday{left:50.7%;top:48.2%;width:47.1%;height:6.15%}
#hWeek{left:2.2%;top:55.0%;width:47.1%;height:6.15%}
#hRules{left:50.7%;top:55.0%;width:47.1%;height:6.15%}
#hHome{left:0;bottom:0;width:20%;height:7.2%}
#hNavLeague{left:20%;bottom:0;width:20%;height:7.2%}
#hNavToday{left:40%;bottom:0;width:20%;height:7.2%}
#hNavWeek{left:60%;bottom:0;width:20%;height:7.2%}
#hNavRules{left:80%;bottom:0;width:20%;height:7.2%}
#hLive{left:2.4%;top:27%;width:94.8%;height:20.35%;z-index:19}

#view{display:none;min-height:100vh;background:#090a0d;padding:18px 14px 90px}
#view.show{display:block}
.panel{border:2px solid #ef2932;border-radius:16px;background:#111318;padding:16px;margin-bottom:12px}
.panel h1{font-size:24px;margin:0 0 12px}
.back{border:1px solid #ef2932;background:#ef2932;border-radius:9px;padding:10px 14px;font-weight:900;margin-bottom:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #30333a}
.btn{border:1px solid #ef2932;background:#ef2932;border-radius:9px;padding:9px 12px;font-weight:900}
.btn.dark{background:#15171b}
.scoreBtns{display:flex;gap:8px;flex-wrap:wrap}
.note{color:#aaa;font-size:13px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <div id="homeScreen" class="screen">
    <div id="liveReplace"></div>
    <div id="tableReplace"></div>

    <button class="hit" id="hLeague" onclick="openView('league')"></button>
    <button class="hit" id="hToday" onclick="openView('today')"></button>
    <button class="hit" id="hWeek" onclick="openView('week')"></button>
    <button class="hit" id="hRules" onclick="openView('rules')"></button>
    <button class="hit" id="hHome" onclick="goHome()"></button>
    <button class="hit" id="hNavLeague" onclick="openView('league')"></button>
    <button class="hit" id="hNavToday" onclick="openView('today')"></button>
    <button class="hit" id="hNavWeek" onclick="openView('week')"></button>
    <button class="hit" id="hNavRules" onclick="openView('rules')"></button>
  </div>
  <div id="view"></div>
</div>

<script>
const KEY='prestige_darts_exact_v1';
const DEFAULT=['Ross','Dan','Josh','Asif','Paul'];
let state=load();

function id(a,b){return [a,b].sort().join('::')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeFixtures(ps){let x=[];for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)x.push({id:id(ps[i],ps[j]),a:ps[i],b:ps[j]});return shuffle(x)}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(s?.players?.length && s?.fixtures?.length)return s;
  }catch(e){}
  return {players:[...DEFAULT],fixtures:makeFixtures(DEFAULT),results:[],live:null};
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function remaining(){const done=new Set(state.results.map(r=>r.id));return state.fixtures.filter(f=>!done.has(f.id))}
function liveFixture(){return state.live?state.fixtures.find(f=>f.id===state.live.id):null}
function startGame(fid){state.live={id:fid,startedAt:Date.now()};save();renderHome()}
function finishGame(winner){const f=liveFixture();if(!f)return;state.results=state.results.filter(r=>r.id!==f.id);state.results.push({id:f.id,a:f.a,b:f.b,winner});state.live=null;save();renderHome()}
function stats(){
  const s={};state.players.forEach(p=>s[p]={p:0,w:0,d:0,l:0,pts:0});
  for(const r of state.results){
    if(!s[r.a]||!s[r.b])continue;
    s[r.a].p++;s[r.b].p++;
    if(r.winner===r.a){s[r.a].w++;s[r.a].pts+=2;s[r.b].l++}
    else if(r.winner===r.b){s[r.b].w++;s[r.b].pts+=2;s[r.a].l++}
    else{s[r.a].d++;s[r.b].d++;s[r.a].pts++;s[r.b].pts++}
  }
  return s;
}
function renderHome(){
  const box=document.getElementById('liveReplace'), table=document.getElementById('tableReplace');
  const f=liveFixture(), rem=remaining().filter(x=>!f||x.id!==f.id);
  if(f){
    box.innerHTML=`<div class="liveHead"><div class="liveTitle"><span class="dot"></span>LIVE NOW</div><div class="meta">MATCH IN PROGRESS</div></div>
      <div class="matchArea"><div class="player">${esc(f.a)}<div class="under"></div></div>
      <div class="scores"><div class="box hot">0</div><div class="dash">-</div><div class="box">0</div></div>
      <div class="player">${esc(f.b)}<div class="under"></div></div><div class="chev">›</div></div>
      <div class="matchNote">SELECT THE WINNER TO FINISH THE GAME</div>
      <div class="next"><div class="nextbar"><b>NEXT UP</b><span>${rem.length} remaining</span></div><div class="queue">${rem.slice(0,3).map(x=>`<div class="fixture"><b>${esc(x.a)}</b><small>VS</small><b>${esc(x.b)}</b></div>`).join('<div class="shuffle">↝</div>') || '<div class="fixture">No games left</div>'}</div></div>`;
  } else {
    const next=rem.slice(0,3);
    box.innerHTML=`<div class="liveHead"><div class="liveTitle"><span class="dot"></span>LIVE NOW</div><div class="meta">NO MATCH STARTED</div></div>
      <div class="matchArea"><div class="player" style="color:#777">—</div><div class="scores"><div class="box">0</div><div class="dash">-</div><div class="box">0</div></div><div class="player" style="color:#777">—</div></div>
      <div class="matchNote">CHOOSE A GAME FROM TODAY'S GAMES</div>
      <div class="next"><div class="nextbar"><b>NEXT UP</b><span>${rem.length} remaining</span></div><div class="queue">${next.map(x=>`<button class="fixture" onclick="startGame('${x.id}')"><b>${esc(x.a)}</b><small>VS</small><b>${esc(x.b)}</b></button>`).join('<div class="shuffle">↝</div>') || '<div class="fixture">All fixtures complete</div>'}</div></div>`;
  }
  const s=stats();
  const rows=state.players.map(n=>({n,...s[n]})).sort((a,b)=>b.pts-a.pts||b.w-a.w||a.n.localeCompare(b.n));
  table.innerHTML=`<div class="tableHead"><span>LEAGUE TABLE (LIVE) <span class="green">●</span></span><span class="updated">UPDATED ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>
  <table><thead><tr><th>#</th><th>PLAYER</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PTS</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><span class="rank">${i+1}</span></td><td><b>${esc(r.n)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td class="pts">${r.pts}</td></tr>`).join('')}</tbody></table>`;
}
function openView(type){
  document.getElementById('homeScreen').style.display='none';
  const v=document.getElementById('view');v.className='show';
  let title=type==='league'?'🏆 LEAGUE TABLE':type==='today'?'🎯 TODAY\'S GAMES':type==='week'?'📅 FULL WEEK':'📋 RULES';
  let body=`<button class="back" onclick="goHome()">‹ BACK</button><div class="panel"><h1>${title}</h1>`;
  if(type==='today'){
    if(state.live){const f=liveFixture();body+=`<div class="item"><b>🔴 LIVE: ${esc(f.a)} vs ${esc(f.b)}</b></div>
      <div class="scoreBtns"><button class="btn" onclick="finishGame('${f.a}')">${esc(f.a)} WINS</button><button class="btn" onclick="finishGame('${f.b}')">${esc(f.b)} WINS</button></div>`}
    body+=remaining().map(f=>`<div class="item"><b>${esc(f.a)} vs ${esc(f.b)}</b><button class="btn" onclick="startGame('${f.id}')">START GAME</button></div>`).join('')||'<div class="note">All games complete 🎯</div>';
  } else if(type==='league'){
    const s=stats();body+=state.players.map((p,i)=>`<div class="item"><b>${i+1}. ${esc(p)}</b><span>${s[p].pts} pts · ${s[p].w}W ${s[p].d}D ${s[p].l}L</span></div>`).join('');
  } else if(type==='week'){
    body+=state.fixtures.map((f,i)=>{const r=state.results.find(x=>x.id===f.id);const live=state.live?.id===f.id;return `<div class="item"><b>${i+1}. ${esc(f.a)} vs ${esc(f.b)}</b><span>${live?'🔴 LIVE':r?'Completed':'Remaining'}</span></div>`}).join('');
  } else {
    body+=`<p class="note">Each pair plays one game. The winner receives 2 points and the loser receives 0. There are no legs.</p><p class="note">Choose a game in Today's Games, then select the winner to finish it. The home screen and league table update immediately.</p>`;
  }
  body+='</div>';v.innerHTML=body;
}
function goHome(){document.getElementById('view').className='';document.getElementById('homeScreen').style.display='block';renderHome()}
renderHome();
</script>
</body>
