<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Prestige Tyres Darts League</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050608;color:#f4f4f4;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:480px;min-height:100vh;margin:auto;position:relative;overflow:hidden;background:
radial-gradient(circle at 82% 10%,rgba(232,49,45,.22),transparent 22%),
radial-gradient(circle at 12% 70%,rgba(232,49,45,.12),transparent 26%),
linear-gradient(180deg,#101216 0%,#090a0c 70%,#111317 100%)}
.app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background:
repeating-linear-gradient(45deg,transparent 0 18px,#777 19px 20px,transparent 21px 38px);
mask-image:linear-gradient(180deg,#000 0 70%,transparent)}
.header{padding:38px 18px 18px;text-align:center;position:relative}
.brand{font-size:40px;line-height:.9;font-weight:1000;font-style:italic;letter-spacing:-2px}
.brand span{color:#f52d2d}
.subbrand{font-size:15px;font-weight:800;letter-spacing:.5px;margin-top:6px}
.league-title{font-size:42px;font-weight:1000;font-style:italic;letter-spacing:-2px;margin-top:24px}
.league-title span{display:block;color:#f52d2d}
.tag{font-size:13px;letter-spacing:1.5px;margin-top:10px;color:#ddd}
.red{color:#ff3030}
.screen{display:none;padding:0 16px 115px;position:relative}
.screen.active{display:block}
.card{background:linear-gradient(145deg,#17191d,#0c0d10);border:1px solid #34373c;border-radius:16px;box-shadow:0 10px 35px rgba(0,0,0,.35)}
.live{border:2px solid #ef2929;overflow:hidden}
.live-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #e52c2c}
.live-dot{display:inline-block;width:16px;height:16px;background:#ff3030;border-radius:50%;margin-right:8px;vertical-align:-2px}
.live-title{font-size:23px;font-weight:900}
.small{font-size:12px;color:#aeb0b6}
.match{padding:16px}
.match-row{display:grid;grid-template-columns:1fr 70px 20px 70px 1fr;align-items:center;gap:8px;text-align:center}
.player{font-size:22px;font-weight:900}
.score{font-size:38px;font-weight:1000;border:1px solid #3b3e44;border-radius:9px;padding:5px 0;background:#0a0b0d}
.score.hot{background:#d92323;border-color:#ff4141}
.vs{font-size:22px;color:#ff3030;font-weight:900}
.match-meta{text-align:center;color:#bbb;font-size:13px;margin-top:8px}
.next{border-top:1px solid #2d3034;margin-top:14px;padding-top:12px}
.next-title{color:#ff3030;font-weight:900;font-size:15px}
.next-list{display:flex;gap:8px;overflow:auto;margin-top:8px;padding-bottom:2px}
.next-game{min-width:125px;border:1px solid #3b3e44;border-radius:10px;padding:9px;text-align:center;background:#0c0d10}
.next-game b{display:block;font-size:14px}
.next-game .vs2{color:#aaa;font-size:11px;margin:3px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{min-height:102px;border:2px solid #e62b2b;border-radius:15px;background:linear-gradient(145deg,#181a1e,#0b0c0e);color:#fff;text-align:left;padding:14px;display:flex;align-items:center;gap:12px}
.tile .ico{font-size:34px}.tile b{display:block;font-size:17px}.tile small{display:block;color:#aaa;margin-top:4px}
.table-card{margin-top:12px;padding:12px}
.table-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e52c2c;padding-bottom:10px}
.table-head b{font-size:20px}.online{width:10px;height:10px;background:#18d978;border-radius:50%;display:inline-block;margin-left:5px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:7px}
th{color:#aaa;font-size:11px;padding:7px 3px;text-align:center}td{padding:8px 3px;text-align:center;border-top:1px solid #202226}
td.name,th.name{text-align:left;min-width:100px}
.pos{display:inline-block;background:#ed2c2c;min-width:28px;padding:6px 4px;border-radius:5px;font-weight:1000}
.pts{color:#ff3030;font-weight:1000}
.legspos{color:#21db76}.legsneg{color:#ff4a4a}
.banner{margin-top:10px;text-align:center;font-weight:900;letter-spacing:1px;padding:13px;background:#0d0f12;border-top:1px solid #34373c;border-bottom:1px solid #34373c}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;height:78px;background:rgba(8,9,11,.97);border-top:1px solid #32353a;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.navbtn{flex:1;border:0;background:none;color:#aaa;font-weight:800;font-size:11px;padding:9px 2px}.navbtn.active{color:#ff3030}.navbtn .navi{display:block;font-size:24px;margin-bottom:3px}
.panel{padding:14px;margin-top:12px}
.panel h2{margin:0 0 10px;font-size:22px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.input{flex:1;background:#090a0c;border:1px solid #3a3d42;color:white;border-radius:9px;padding:12px}
.btn{border:1px solid #ef3030;background:#ef3030;color:#fff;border-radius:9px;padding:11px 14px;font-weight:900}
.btn.dark{background:#15171b;border-color:#45484e}.btn.green{background:#148b50;border-color:#24c477}.btn.danger{background:#7d1616;border-color:#ff3d3d}
.game-card{padding:12px;margin:8px 0;border:1px solid #34373c;border-radius:12px;background:#101216}
.game-line{display:flex;justify-content:space-between;align-items:center;gap:8px}.game-name{font-weight:900}.game-score{font-size:22px;font-weight:1000}.badge{font-size:10px;border-radius:20px;padding:5px 8px;background:#30333a;color:#ddd}.badge.liveb{background:#b51d1d}.badge.done{background:#175d3e}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.controls .btn{padding:8px 10px;font-size:12px}
.section-title{margin:18px 0 8px;font-size:18px;font-weight:900}
.empty{color:#999;text-align:center;padding:25px}
.player-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #282b30}
.notice{padding:10px;border-radius:10px;background:#24262b;color:#bbb;font-size:12px;margin-top:10px}
footer{height:30px}
@media(max-width:360px){.brand{font-size:33px}.league-title{font-size:35px}.match-row{grid-template-columns:1fr 58px 16px 58px 1fr}.player{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand">PRESTIGE <span>TYRES</span></div>
  <div class="subbrand">MOBILE TYRE FITTING SERVICE</div>
  <div class="league-title">DARTS <span>LEAGUE</span></div>
  <div class="tag">GOOD DARTS • GOOD MATES • GREAT NIGHTS</div>
</header>

<section id="home" class="screen active"></section>
<section id="league" class="screen"></section>
<section id="today" class="screen"></section>
<section id="week" class="screen"></section>
<section id="rules" class="screen"></section>

<div class="bottom">
  <button class="navbtn active" data-screen="home"><span class="navi">⌂</span>Home</button>
  <button class="navbtn" data-screen="league"><span class="navi">🏆</span>League</button>
  <button class="navbtn" data-screen="today"><span class="navi">🎯</span>Today</button>
  <button class="navbtn" data-screen="week"><span class="navi">▣</span>Week</button>
  <button class="navbtn" data-screen="rules"><span class="navi">☷</span>Rules</button>
</div>
</div>

<script>
const KEY="prestigeDartsLeagueV2";
const defaultPlayers=["Ross","Dan","Josh","Asif","Paul"];
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
  players:defaultPlayers,
  fixtures:[],
  liveId:null,
  nextOrder:[],
  pointsWin:2,
  pointsDraw:1,
  legsToWin:5
};

function save(){localStorage.setItem(KEY,JSON.stringify(state));renderAll()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function id(a,b){return [a,b].sort().join("__")}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function ensureFixtures(){
  const known=new Set(state.fixtures.map(f=>id(f.a,f.b)));
  const additions=[];
  for(let i=0;i<state.players.length;i++)for(let j=i+1;j<state.players.length;j++){
    const key=id(state.players[i],state.players[j]);
    if(!known.has(key)) additions.push({id:key,a:state.players[i],b:state.players[j],status:"pending",aScore:0,bScore:0,aLegs:0,bLegs:0});
  }
  if(additions.length) state.fixtures.push(...shuffle(additions));
  if(!state.nextOrder.length) reshuffleQueue();
}
function reshuffleQueue(){
  state.nextOrder=shuffle(state.fixtures.filter(f=>f.status==="pending").map(f=>f.id));
}
function getFixture(fid){return state.fixtures.find(f=>f.id===fid)}
function pendingFixtures(){return state.nextOrder.map(getFixture).filter(Boolean).filter(f=>f.status==="pending")}
function liveFixture(){return state.liveId?getFixture(state.liveId):null}

function startMatch(fid){
  const f=getFixture(fid); if(!f||f.status!=="pending")return;
  if(state.liveId && state.liveId!==fid){alert("Finish the current live match first.");return}
  state.liveId=fid; f.status="live"; save();
}
function setLeg(fid,winner){
  const f=getFixture(fid); if(!f)return;
  if(f.status!=="live") startMatch(fid);
  if(f.status!=="live")return;
  if(winner==="a")f.aLegs++;else f.bLegs++;
  f.aScore=f.aLegs; f.bScore=f.bLegs;
  if(f.aLegs>=state.legsToWin||f.bLegs>=state.legsToWin) finishMatch(fid);
  else save();
}
function undoLeg(fid){
  const f=getFixture(fid);if(!f||f.status!=="live")return;
  if(f.aLegs+f.bLegs===0)return;
  if(f.aLegs>f.bLegs)f.aLegs--; else f.bLegs--;
  f.aScore=f.aLegs;f.bScore=f.bLegs;save();
}
function finishMatch(fid){
  const f=getFixture(fid);if(!f)return;
  if(f.aLegs===f.bLegs){alert("A match cannot finish level. Add another leg.");return}
  f.status="done";f.aScore=f.aLegs;f.bScore=f.bLegs;
  if(state.liveId===fid)state.liveId=null;
  state.nextOrder=state.nextOrder.filter(x=>x!==fid);
  save();
}
function cancelLive(fid){
  const f=getFixture(fid);if(!f)return;
  if(!confirm("Cancel this live match and reset its score?"))return;
  f.status="pending";f.aLegs=f.bLegs=f.aScore=f.bScore=0;
  if(state.liveId===fid)state.liveId=null;
  if(!state.nextOrder.includes(fid))state.nextOrder.push(fid);
  save();
}

function stats(){
  const s={};state.players.forEach(p=>s[p]={p:0,w:0,d:0,l:0,pts:0,lf:0,la:0});
  state.fixtures.filter(f=>f.status==="done").forEach(f=>{
    if(!s[f.a]||!s[f.b])return;
    s[f.a].p++;s[f.b].p++;s[f.a].lf+=f.aLegs;s[f.a].la+=f.bLegs;s[f.b].lf+=f.bLegs;s[f.b].la+=f.aLegs;
    if(f.aLegs>f.bLegs){s[f.a].w++;s[f.a].pts+=state.pointsWin;s[f.b].l++}
    else if(f.bLegs>f.aLegs){s[f.b].w++;s[f.b].pts+=state.pointsWin;s[f.a].l++}
    else{s[f.a].d++;s[f.b].d++;s[f.a].pts+=state.pointsDraw;s[f.b].pts+=state.pointsDraw}
  });
  return Object.entries(s).map(([name,x])=>({name,...x,ld:x.lf-x.la})).sort((a,b)=>b.pts-a.pts||b.ld-a.ld||b.w-a.w||a.name.localeCompare(b.name));
}
function liveLegAdjust(rows){
  const f=liveFixture(); if(!f)return rows;
  return rows.map(r=>{
    if(r.name===f.a) return {...r,lf:r.lf+f.aLegs,la:r.la+f.bLegs,ld:r.ld+f.aLegs-f.bLegs};
    if(r.name===f.b) return {...r,lf:r.lf+f.bLegs,la:r.la+f.aLegs,ld:r.ld+f.bLegs-f.aLegs};
    return r;
  }).sort((a,b)=>b.pts-a.pts||b.ld-a.ld||b.w-a.w||a.name.localeCompare(b.name));
}
function tableHTML(live=true){
  let rows=stats(); if(live)rows=liveLegAdjust(rows);
  if(!rows.length)return "<div class='empty'>No players yet.</div>";
  return `<div class="table-wrap"><table><thead><tr><th>#</th><th class="name">PLAYER</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PTS</th><th>LEGS +/-</th></tr></thead><tbody>`+
  rows.map((r,i)=>`<tr><td><span class="pos">${i+1}</span></td><td class="name"><b>${esc(r.name)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td class="pts">${r.pts}</td><td class="${r.ld>=0?'legspos':'legsneg'}">${r.ld>=0?'+':''}${r.ld}</td></tr>`).join("")+
  "</tbody></table></div>";
}
function home(){
  const live=liveFixture(), next=pendingFixtures().slice(0,3);
  return `<div class="live card">
    <div class="live-head"><div><span class="live-dot"></span><span class="live-title">${live?"LIVE NOW":"READY"}</span></div><span class="small">${state.fixtures.filter(f=>f.status==="done").length} COMPLETED • ${state.fixtures.length} TOTAL</span></div>
    <div class="match">${live?`
      <div class="match-row"><div class="player">${esc(live.a)}</div><div class="score hot">${live.aLegs}</div><div class="vs">-</div><div class="score">${live.bLegs}</div><div class="player">${esc(live.b)}</div></div>
      <div class="match-meta">Leg ${live.aLegs+live.bLegs+1} • First to ${state.legsToWin} Legs</div>
      <div class="controls" style="justify-content:center"><button class="btn" onclick="setLeg('${live.id}','a')">${esc(live.a)} wins leg</button><button class="btn dark" onclick="undoLeg('${live.id}')">Undo</button><button class="btn" onclick="setLeg('${live.id}','b')">${esc(live.b)} wins leg</button></div>
      <div class="controls" style="justify-content:center"><button class="btn green" onclick="finishMatch('${live.id}')">Finish match</button><button class="btn danger" onclick="cancelLive('${live.id}')">Cancel</button></div>
    `:`<div class="empty">No match is live right now.<br><button class="btn" style="margin-top:12px" onclick="go('today')">Start Today's Games</button></div>`}
      <div class="next"><div class="next-title">NEXT UP <span class="small"> (SHUFFLED) 🔀</span></div><div class="next-list">${next.length?next.map(f=>`<div class="next-game"><b>${esc(f.a)}</b><div class="vs2">VS</div><b>${esc(f.b)}</b><button class="btn" style="margin-top:7px;padding:6px 9px;font-size:11px" onclick="startMatch('${f.id}')">START</button></div>`).join(""):"<div class='small'>All fixtures completed.</div>"}</div></div>
    </div></div>
    <div class="grid">
      <button class="tile" onclick="go('league')"><span class="ico">🏆</span><span><b>LEAGUE TABLE</b><small>VIEW STANDINGS</small></span></button>
      <button class="tile" onclick="go('today')"><span class="ico">🎯</span><span><b>TODAY'S GAMES</b><small>ENTER RESULTS</small></span></button>
      <button class="tile" onclick="go('week')"><span class="ico">▣</span><span><b>FULL WEEK</b><small>VIEW ALL FIXTURES</small></span></button>
      <button class="tile" onclick="go('rules')"><span class="ico">☷</span><span><b>RULES</b><small>LEAGUE MANAGEMENT</small></span></button>
    </div>
    <div class="table-card card"><div class="table-head"><b>LEAGUE TABLE (LIVE) <span class="online"></span></b><span class="small">UPDATED NOW ↻</span></div>${tableHTML(true)}</div>
    <div class="banner">/// EMERGENCY <span class="red">24HR</span> CALL OUT ///</div><footer></footer>`;
}
function league(){
  return `<div class="panel card"><h2>🏆 League Table</h2>${tableHTML(false)}</div>
  <div class="panel card"><h2>⚙️ League Settings</h2>
    <div class="row"><label class="small">Points for a win</label><input id="winPts" class="input" type="number" min="0" value="${state.pointsWin}"></div>
    <div class="row"><label class="small">Points for a draw</label><input id="drawPts" class="input" type="number" min="0" value="${state.pointsDraw}"></div>
    <div class="row"><label class="small">First to legs</label><input id="legsToWin" class="input" type="number" min="1" value="${state.legsToWin}"></div>
    <button class="btn" onclick="settingsSave()">SAVE SETTINGS</button>
  </div>`;
}
function today(){
  const live=liveFixture();
  const pending=pendingFixtures();
  const done=state.fixtures.filter(f=>f.status==="done");
  return `<div class="panel card"><h2>🎯 Today's Games <span class="small">• shuffled order</span></h2>
    ${live?`<div class="notice">🔴 <b>${esc(live.a)} ${live.aLegs} - ${live.bLegs} ${esc(live.b)}</b> is live. Update it below.</div>`:"<div class='notice'>Pick any remaining fixture to start it. The queue never duplicates a played matchup.</div>"}
    <div class="section-title">UP NEXT</div>${pending.length?pending.map((f,i)=>gameCard(f,i===0)).join(""):"<div class='empty'>No remaining fixtures.</div>"}
    <div class="section-title">COMPLETED</div>${done.length?done.map(f=>gameCard(f,false)).join(""):"<div class='empty'>No completed games yet.</div>"}
  </div>`;
}
function gameCard(f,isNext){
  const live=f.status==="live",done=f.status==="done";
  return `<div class="game-card"><div class="game-line"><div><span class="game-name">${esc(f.a)} vs ${esc(f.b)}</span><br><span class="small">${isNext?"NEXT UP":done?"COMPLETED":live?"LIVE":""}</span></div><div class="game-score">${f.aLegs} - ${f.bLegs}</div><span class="badge ${live?"liveb":done?"done":""}">${live?"LIVE":done?"DONE":"PENDING"}</span></div>
  <div class="controls">${!done&&!live?`<button class="btn" onclick="startMatch('${f.id}')">START</button>`:""}${live?`<button class="btn" onclick="setLeg('${f.id}','a')">${esc(f.a)} +1 leg</button><button class="btn dark" onclick="undoLeg('${f.id}')">UNDO</button><button class="btn" onclick="setLeg('${f.id}','b')">${esc(f.b)} +1 leg</button><button class="btn green" onclick="finishMatch('${f.id}')">FINISH</button>`:""}${live?`<button class="btn danger" onclick="cancelLive('${f.id}')">CANCEL</button>`:""}</div></div>`;
}
function week(){
  return `<div class="panel card"><h2>📅 Full Fixtures</h2><div class="notice">The fixture list is generated from every unique player pairing. Playing order is shuffled separately, so the same two players are never created twice.</div>
  ${state.fixtures.map((f,i)=>`<div class="game-card"><div class="game-line"><span><b>${i+1}. ${esc(f.a)} vs ${esc(f.b)}</b><br><span class="small">${f.status.toUpperCase()}</span></span><b>${f.aLegs}-${f.bLegs}</b></div></div>`).join("")}</div>`;
}
function rules(){
  return `<div class="panel card"><h2>👥 League Management</h2>
    <div class="notice">Add or remove players without editing the code. Adding a player creates only their new unique fixtures. Existing completed results are kept.</div>
    <div class="row"><input id="newPlayer" class="input" placeholder="Player name"><button class="btn" onclick="addPlayer()">ADD</button></div>
    <div>${state.players.map(p=>`<div class="player-row"><b>${esc(p)}</b><button class="btn danger" onclick="removePlayer('${encodeURIComponent(p)}')">DELETE</button></div>`).join("")}</div>
  </div>
  <div class="panel card"><h2>🎯 How it works</h2><div class="notice">Start a match, award each leg as it happens, and the live score on Home changes instantly. Completed matches update P/W/D/L/PTS. Live legs also appear in LEGS +/- so the table reflects the current action.</div>
  <div class="controls"><button class="btn dark" onclick="reshuffleQueue();save()">🔀 Shuffle remaining games</button><button class="btn danger" onclick="resetLeague()">RESET ALL</button></div></div>`;
}
function addPlayer(){
  const el=document.getElementById("newPlayer");let name=el.value.trim();
  if(!name)return alert("Enter a player name.");if(state.players.some(p=>p.toLowerCase()===name.toLowerCase()))return alert("That player is already in the league.");
  state.players.push(name);ensureFixtures();reshuffleQueue();save();go("rules");
}
function removePlayer(encoded){
  const name=decodeURIComponent(encoded);
  if(state.players.length<=2)return alert("Keep at least two players in the league.");
  if(!confirm("Remove "+name+"? Completed matches are kept, but their unfinished fixtures will be removed."))return;
  if(state.liveId && getFixture(state.liveId) && (getFixture(state.liveId).a===name||getFixture(state.liveId).b===name)){return alert("Finish or cancel their live match first.")}
  state.players=state.players.filter(p=>p!==name);
  state.fixtures=state.fixtures.filter(f=>f.a!==name&&f.b!==name);
  state.nextOrder=state.nextOrder.filter(fid=>getFixture(fid));
  save();go("rules");
}
function settingsSave(){
  state.pointsWin=Math.max(0,Number(document.getElementById("winPts").value)||0);
  state.pointsDraw=Math.max(0,Number(document.getElementById("drawPts").value)||0);
  state.legsToWin=Math.max(1,Number(document.getElementById("legsToWin").value)||5);save();
}
function resetLeague(){
  if(!confirm("Reset every result and rebuild the fixture list?"))return;
  state.fixtures=[];state.liveId=null;state.nextOrder=[];ensureFixtures();save();go("home");
}
function go(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.screen===id));
  renderAll();
  window.scrollTo(0,0);
}
function renderAll(){
  ensureFixtures();
  document.getElementById("home").innerHTML=home();
  document.getElementById("league").innerHTML=league();
  document.getElementById("today").innerHTML=today();
  document.getElementById("week").innerHTML=week();
  document.getElementById("rules").innerHTML=rules();
}
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>go(b.dataset.screen)));
ensureFixtures();save();
</script>
</body>
</html>
